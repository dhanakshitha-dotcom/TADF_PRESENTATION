<p class="p rv" style="position:absolute;left:0;right:0;bottom:-8px;text-align:center;font-size:23px">The hole is not a particle in the molecule. It is an <b style="color:var(--ink);font-weight:500">absent electron</b> that behaves like a positive quasiparticle.</p>
