<!--meta {"file":"07-light-colour","num":7,"acc":"sing","eyebrow":"III · Making light","title":"The <em>gap</em> sets the colour","src":"Photon energy ≈ S₁ − S₀ energy difference (after relaxation); λ[nm] = 1239.84 / E[eV]; display colours approximate","interactive":true} -->
<div class="row" style="height:100%;gap:50px">
  <div class="col" style="width:520px;gap:24px">
    <p class="lead rv">From <span class="c-s">S₁</span> down to <span class="c-d">S₀</span>, the molecule can release its energy as a photon.</p>
    <div class="eq rv" style="--d:.15s;font-size:30px;padding:18px 24px"><tex d>h\nu=E_{\text{excited}}-E_{\text{ground}}=\frac{hc}{\lambda}</tex></div>
    <div class="ctl rv" style="--d:.3s">
      <span class="lab">Energy gap <b>{{E}} eV</b></span>
      <input type="range" min="1.65" max="3.2" step="0.01" value="{{Eraw}}" onInput="{{onE}}" aria-label="Energy gap in electronvolts">
      <div class="row" style="justify-content:space-between"><span class="cap">small gap, red</span><span class="cap">large gap, blue</span></div>
    </div>
    <div class="row g12 rv" style="--d:.4s;flex-wrap:wrap">
      <button class="btn" onClick="{{setRed}}">Red 1.97</button>
      <button class="btn" onClick="{{setGreen}}">Green 2.34</button>
      <button class="btn" onClick="{{setBlue}}">Blue 2.76</button>
    </div>
    <div class="row g32 rv" style="--d:.5s;align-items:center">
      <div class="read">{{lam}}<small>wavelength, nm</small></div>
      <div style="width:84px;height:84px;border-radius:50%;flex:none" aria-label="Emitted colour" role="img"><div style="width:100%;height:100%;border-radius:50%;background: {{rgb}};box-shadow: 0 0 44px {{rgb}}"></div></div>
      <div class="serif" style="font-size:44px;color: {{rgbL}}">{{name}}</div>
    </div>
  </div>
  <div style="flex:1;position:relative">
    <svg viewBox="0 0 800 560" width="100%" height="100%" role="img" aria-label="Energy-level diagram: a singlet excited state above the ground state, with a photon emitted whose colour depends on the gap">
      <defs><marker id="dn" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0 0 L16 8 L0 16 Z" fill="#62e7f4"/></marker></defs>
      <!-- axis -->
      <path d="M40 470 V30" stroke="#8394b0" stroke-width="2"/><path d="M40 30 l-6 12 M40 30 l6 12" stroke="#8394b0" stroke-width="2"/>
      <text x="56" y="38" class="sv" font-size="16" fill="#8394b0">ENERGY</text>
      <!-- S0 -->
      <line x1="110" y1="440" x2="430" y2="440" stroke="#8394b0" stroke-width="5" stroke-linecap="round"/>
      <text x="110" y="470" class="sv" font-size="22" font-weight="600" fill="#adbbd2">S₀</text>
      <text x="170" y="470" class="sv" font-size="15" fill="#8394b0">singlet ground state</text>
      <!-- S1 -->
      <line x1="110" y1="{{y1}}" x2="430" y2="{{y1}}" stroke="#62e7f4" stroke-width="5" stroke-linecap="round"/>
      <text x="110" y="{{y1lab}}" class="sv" font-size="22" font-weight="600" fill="#62e7f4">S₁</text>
      <text x="170" y="{{y1lab}}" class="sv" font-size="15" fill="#8394b0">lowest excited singlet</text>
      <!-- transition arrow -->
      <path d="M270 {{y1b}} V420" stroke="#62e7f4" stroke-width="4" fill="none" marker-end="url(#dn)"/>
      <!-- gap bracket -->
      <path d="M86 {{y1}} V440 M78 {{y1}} H94 M78 440 H94" stroke="#adbbd2" stroke-width="2" fill="none"/>
      <text x="70" y="{{ymid}}" text-anchor="middle" class="sv" font-size="17" fill="#f1f6ff" transform="rotate(-90 70 {{ymid}})">ΔE = {{E}} eV</text>
      <!-- photon -->
      <path d="{{wave}}" stroke="{{rgb}}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" style="filter: drop-shadow(0 0 7px {{rgb}})"/>
      <text x="720" y="{{wlab}}" text-anchor="end" class="sv" font-size="17" fill="{{rgbL}}">photon, {{lam}} nm</text>
      <path d="M300 {{ymid}} H440" stroke="{{rgb}}" stroke-width="2" stroke-dasharray="3 7" opacity=".7"/>
    </svg>
    <div style="position:absolute;left:0;right:0;bottom:-6px">
      <div style="height:18px;border-radius:9px;background: {{grad}};position:relative"><div style="position:absolute;top:-8px;left: {{mpos}}%;width:4px;height:34px;background:#fff;border-radius:2px;margin-left:-2px"></div></div>
      <div class="row" style="justify-content:space-between;margin-top:8px"><span class="cap">380 nm · 3.26 eV</span><span class="cap">visible spectrum</span><span class="cap">780 nm · 1.59 eV</span></div>
    </div>
  </div>
</div>
<script>
class Component extends DCLogic {
  wl2rgb(w) {
    let r = 0, g = 0, b = 0;
    if (w >= 380 && w < 440) { r = -(w - 440) / 60; b = 1; }
    else if (w < 490) { g = (w - 440) / 50; b = 1; }
    else if (w < 510) { g = 1; b = -(w - 510) / 20; }
    else if (w < 580) { r = (w - 510) / 70; g = 1; }
    else if (w < 645) { r = 1; g = -(w - 645) / 65; }
    else if (w <= 780) { r = 1; }
    let f = 1; if (w < 420) f = 0.3 + 0.7 * (w - 380) / 40; else if (w > 700) f = 0.3 + 0.7 * (780 - w) / 80;
    const c = (v) => Math.round(255 * Math.pow(Math.max(0, Math.min(1, v * f)), 0.8));
    return `rgb(${c(r)},${c(g)},${c(b)})`;
  }
  renderVals() {
    const E = Math.max(1.65, Math.min(3.2, this.state.E ?? 2.76));
    const lamN = 1239.84 / E;
    const rgb = this.wl2rgb(lamN);
    const rgbL = rgb.replace(/\d+/g, (v) => Math.round(+v + (255 - +v) * 0.42));
    const y1 = 440 - 120 * E;
    const ymid = (y1 + 440) / 2;
    const pw = lamN / 450 * 46;
    let wave = ''; const x0 = 440, x1 = 720, A = 20;
    for (let x = x0; x <= x1; x += 4) { const y = ymid + A * Math.sin(2 * Math.PI * (x - x0) / pw); wave += (x === x0 ? 'M' : 'L') + x + ' ' + y.toFixed(1) + ' '; }
    const stops = []; for (let w = 380; w <= 780; w += 20) stops.push(this.wl2rgb(w) + ' ' + ((w - 380) / 4).toFixed(1) + '%');
    const name = lamN >= 620 ? 'Red' : lamN >= 590 ? 'Orange' : lamN >= 570 ? 'Yellow' : lamN >= 495 ? 'Green' : lamN >= 475 ? 'Cyan' : lamN >= 450 ? 'Blue' : 'Violet-blue';
    return {
      E: E.toFixed(2), Eraw: E, lam: Math.round(lamN), rgb, rgbL, name, y1, y1b: y1 + 8, y1lab: y1 - 14, ymid, wave: wave.trim(), wlab: ymid - 38,
      grad: 'linear-gradient(90deg,' + stops.join(',') + ')',
      mpos: Math.max(0, Math.min(100, (lamN - 380) / 4)),
      onE: (e) => this.setState({ E: parseFloat(e.target.value) }),
      setRed: () => this.setState({ E: 1.97 }), setGreen: () => this.setState({ E: 2.34 }), setBlue: () => this.setState({ E: 2.76 }),
    };
  }
}
</script>
